async function open_(code){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);

  return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
